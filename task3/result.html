<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор — результат</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="card">
        <h1 class="page-title">Результат вычисления</h1>

        <table id="resultTable" class="result-table">
            <caption>Выполненная операция</caption>
            <tr>
                <th>Первый аргумент (A)</th>
                <td id="argA">—</td>
            </tr>
            <tr>
                <th>Операция</th>
                <td id="operation">—</td>
            </tr>
            <tr>
                <th>Второй аргумент (B)</th>
                <td id="argB">—</td>
            </tr>
            <tr class="result-row">
                <th>Результат</th>
                <td id="resultValue">—</td>
            </tr>
        </table>

        <figure class="photo-block">
            <img src="photo.png" alt="Моя любимая фотография — горы на закате" class="photo">
        </figure>

        <a href="index.html" class="back-link">Вернуться на главную страницу</a>
    </main>

    <script src="script.js"></script>
</body>
</html>
